  function renderCartDrawer(){
    return `<div class="fixed inset-0 z-[80]"><button class="absolute inset-0 bg-ink/55 backdrop-blur-sm" aria-label="إغلاق السلة" onclick="Hopa.toggleCart()"></button><aside class="drawer absolute top-0 bottom-0 right-0 w-full sm:max-w-[490px] bg-white shadow-2xl flex flex-col ${state.cartOpen?'translate-x-0':'translate-x-full'}"><div class="h-20 px-5 sm:px-6 border-b border-stone-100 flex items-center gap-3"><button onclick="Hopa.toggleCart()" class="w-10 h-10 rounded-xl bg-stone-100 flex items-center justify-center">${icon('x')}</button><div><h2 class="font-black text-xl">${state.checkout?'بيانات التوصيل':'سلة المشتريات'}</h2><p class="text-xs text-stone-400 font-bold">${state.checkout?'اكتب بياناتك لتأكيد الطلب':'راجع طلبك قبل ما تكمل'}</p></div></div>
      <div class="flex-1 overflow-y-auto bg-cream/70 p-4 sm:p-5">${!state.checkout?state.cart.length?`<div class="space-y-3">${state.cart.map(item=>`<article class="bg-white border border-stone-100 rounded-2xl p-3 flex gap-3"><img src="${escapeHTML(item.img)}" alt="" class="w-24 h-24 rounded-xl object-cover bg-stone-100"><div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><div><h3 class="font-black leading-6">${escapeHTML(item.name)}</h3><p class="text-xs text-stone-500 mt-1 font-bold">${escapeHTML(item.size)}</p></div><button onclick="Hopa.removeCart('${item.id}')" class="text-stone-300 hover:text-brand">${icon('trash-2','w-4 h-4')}</button></div>${item.addons.length?`<p class="text-[10px] text-stone-500 mt-1">${item.addons.map(a=>escapeHTML(a.name)).join('، ')}</p>`:''}<div class="flex justify-between items-center mt-2"><b>${money(item.itemTotal)}</b><div class="flex items-center gap-2 bg-stone-50 border border-stone-100 p-1 rounded-lg"><button onclick="Hopa.qtyCart('${item.id}',1)" class="w-6 h-6 bg-white rounded shadow-sm">+</button><span class="text-xs font-black w-4 text-center">${item.qty}</span><button onclick="Hopa.qtyCart('${item.id}',-1)" class="w-6 h-6 bg-white rounded shadow-sm">−</button></div></div></div></article>`).join('')}</div>`:`<div class="min-h-full flex flex-col items-center justify-center text-center py-16"><div class="w-20 h-20 bg-white shadow-sm rounded-3xl flex items-center justify-center text-stone-300 mb-4">${icon('shopping-bag','w-9 h-9')}</div><h3 class="text-xl font-black">السلة لسه فاضية</h3><p class="text-sm text-stone-500 mt-2">اختار حاجة حلوة من المنيو وارجعلنا.</p><button onclick="Hopa.toggleCart()" class="mt-5 btn-primary rounded-xl px-5 py-3 font-black">تصفح المنيو</button></div>`:`<form id="checkout-form" onsubmit="Hopa.submitOrder(event)" class="space-y-4"><div class="rounded-2xl bg-emerald-50 border border-emerald-100 p-4 flex gap-3 text-emerald-800">${icon('shield-check','w-5 h-5 shrink-0')}<p class="text-xs font-bold leading-6">طلبك هيتسجل في قاعدة البيانات، وبعدها هتفتح رسالة واتساب لتأكيده مع المطعم.</p></div><label class="block bg-white border border-stone-200 rounded-2xl p-3"><span class="text-[10px] text-stone-400 font-black">الاسم بالكامل</span><input required minlength="2" maxlength="100" name="name" autocomplete="name" class="w-full mt-1 font-bold outline-none" placeholder="اكتب اسمك"></label><label class="block bg-white border border-stone-200 rounded-2xl p-3"><span class="text-[10px] text-stone-400 font-black">رقم الهاتف</span><input required type="tel" inputmode="tel" maxlength="25" name="phone" dir="ltr" class="w-full mt-1 font-bold text-left outline-none" placeholder="01xxxxxxxxx"></label><label class="block bg-white border border-stone-200 rounded-2xl p-3"><span class="text-[10px] text-stone-400 font-black">عنوان التوصيل بالتفصيل</span><textarea required minlength="5" maxlength="500" name="address" rows="2" class="w-full mt-1 font-bold outline-none resize-none" placeholder="المنطقة، الشارع، علامة مميزة..."></textarea></label><label class="block bg-white border border-stone-200 rounded-2xl p-3"><span class="text-[10px] text-stone-400 font-black">ملاحظات (اختياري)</span><input maxlength="500" name="notes" class="w-full mt-1 font-bold outline-none" placeholder="من غير بصل، تسوية زيادة..."></label><button type="button" onclick="Hopa.setCheckout(false)" class="text-stone-500 font-bold text-sm">${icon('arrow-right','w-4 h-4 inline-block align-middle')} الرجوع للسلة</button></form>`}</div>
      ${state.cart.length?`<div class="border-t border-stone-100 p-5 bg-white safe-footer"><div class="space-y-2 mb-4"><div class="flex justify-between text-sm font-bold text-stone-500"><span>قيمة المنتجات</span><span class="text-ink">${money(subtotal())}</span></div><div class="flex justify-between text-sm font-bold text-stone-500"><span>التوصيل</span><span class="text-ink">${money(state.settings.delivery_fee)}</span></div><div class="h-px bg-stone-100 my-3"></div><div class="flex justify-between items-center"><b class="font-black text-lg">الإجمالي</b><strong class="font-black text-2xl text-brand">${money(total())}</strong></div></div>${state.checkout?`<button form="checkout-form" type="submit" class="btn-primary w-full rounded-2xl py-4 font-black flex items-center justify-center gap-3 ${state.loading?'opacity-60':''}" ${state.loading?'disabled':''}>${icon('send','w-5 h-5')}${state.loading?'جارٍ تسجيل الطلب...':'تأكيد الطلب عبر واتساب'}</button>`:`<button onclick="Hopa.setCheckout(true)" class="w-full rounded-2xl bg-ink text-white py-4 font-black flex items-center justify-center gap-3">متابعة الطلب ${icon('arrow-left','w-5 h-5')}</button>`}</div>`:''}
    </aside></div>`;
  }
  const Hopa={
    async refresh(){state.loading=true;render();try{await loadCatalog();state.loading=false;render();toast('تم تحديث المنيو')}catch(e){state.loading=false;render();toast('تعذر تحميل المنيو: '+(e.message||'تحقق من إعدادات Supabase'),'error')}},
    search(value){state.search=value;if(String(value).trim())state.category='all';const cursor=$('#menu-search')?.selectionStart;render();const input=$('#menu-search');if(input){input.focus();try{input.setSelectionRange(cursor,cursor)}catch(_){}}},
    category(id){state.category=id;state.search='';render()},
    toggleMobile(){const menu=$('#mobile-menu'),btn=$('#mobile-menu-btn');if(!menu)return;const open=!menu.classList.contains('open');menu.classList.toggle('open',open);menu.setAttribute('aria-hidden',String(!open));btn?.setAttribute('aria-expanded',String(open));const spans=btn?.querySelectorAll('span')||[];if(open){if(spans[0])spans[0].style.transform='rotate(45deg) translate(5px,5px)';if(spans[1])spans[1].style.opacity='0';if(spans[2])spans[2].style.transform='rotate(-45deg) translate(5px,-5px)';document.body.style.overflow='hidden'}else{if(spans[0])spans[0].style.transform='';if(spans[1])spans[1].style.opacity='1';if(spans[2])spans[2].style.transform='';document.body.style.overflow=state.cartOpen||state.modal?'hidden':''}},
    closeMobile(){const menu=$('#mobile-menu'),btn=$('#mobile-menu-btn');if(menu){menu.classList.remove('open');menu.setAttribute('aria-hidden','true')}btn?.setAttribute('aria-expanded','false');const spans=btn?.querySelectorAll('span')||[];if(spans[0])spans[0].style.transform='';if(spans[1])spans[1].style.opacity='1';if(spans[2])spans[2].style.transform='';document.body.style.overflow=state.cartOpen||state.modal?'hidden':''},
    openProduct(id){const p=productById(id);if(!p)return;const s=productSizes(p);state.modal={product:p,size:s[0]?.name||'',qty:1,addonIds:[]};render();document.body.style.overflow='hidden'},
    closeProduct(){state.modal=null;render();document.body.style.overflow=state.cartOpen?'hidden':''},
    chooseSize(size){if(!state.modal)return;state.modal.size=size;render()},
    toggleAddon(id){if(!state.modal)return;const idx=state.modal.addonIds.indexOf(id);idx>=0?state.modal.addonIds.splice(idx,1):state.modal.addonIds.push(id);render()},
    qtyModal(delta){if(!state.modal)return;state.modal.qty=Math.max(1,Math.min(50,state.modal.qty+delta));render()},
    addToCart(){if(!state.modal)return;const m=state.modal,p=m.product;if(productSizes(p).length&&!m.size){toast('اختار الحجم الأول','error');return}const selected=addonGroupFor(p).filter(a=>m.addonIds.includes(a.id)).map(a=>({id:a.id,name:a.name,price:priceForAddon(a,m.size)}));const unit=Number(productSizes(p).find(s=>s.name===m.size)?.price||0)+selected.reduce((s,a)=>s+a.price,0);state.cart.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),productId:p.id,name:p.name,img:p.image_url||imageFallback(p.name),size:m.size,qty:m.qty,addonIds:m.addonIds.slice(),addons:selected,unitPrice:unit,itemTotal:unit*m.qty});state.modal=null;document.body.style.overflow=state.cartOpen?'hidden':'';render();toast('اتضاف للسلة بنجاح')},
    toggleCart(){state.cartOpen=!state.cartOpen;if(!state.cartOpen)state.checkout=false;render();document.body.style.overflow=state.cartOpen?'hidden':''},
    setCheckout(value){state.checkout=Boolean(value);render()},
    removeCart(id){state.cart=state.cart.filter(c=>c.id!==id);if(!state.cart.length)state.checkout=false;render()},
    qtyCart(id,delta){const item=state.cart.find(c=>c.id===id);if(!item)return;item.qty=Math.max(1,Math.min(50,item.qty+delta));item.itemTotal=item.unitPrice*item.qty;render()},
    async submitOrder(event){event.preventDefault();if(state.loading||!state.cart.length)return;const form=event.currentTarget;const fd=new FormData(form);const customer={name:String(fd.get('name')||'').trim(),phone:String(fd.get('phone')||'').trim(),address:String(fd.get('address')||'').trim(),notes:String(fd.get('notes')||'').trim()};const digits=customer.phone.replace(/\D/g,'');if(customer.name.length<2||digits.length<10||digits.length>15||customer.address.length<5){toast('راجع الاسم ورقم الهاتف والعنوان','error');return}
      const whatsappTab=window.open('about:blank','_blank');state.loading=true;render();try{const items=state.cart.map(item=>({product_id:item.productId,size:item.size,quantity:item.qty,addon_ids:item.addonIds}));const {data,error}=await client.rpc('create_hopa_order',{p_customer_name:customer.name,p_phone:customer.phone,p_address:customer.address,p_notes:customer.notes,p_items:items});if(error)throw error;if(!data?.order_number)throw new Error('لم نستلم رقم الطلب من قاعدة البيانات.');let msg=`🍕 *طلب جديد - ${CONFIG.name}* 🍕\nرقم الطلب: #${data.order_number}\n━━━━━━━━━━━━━━━━━━\n👤 *الاسم:* ${customer.name}\n📞 *الهاتف:* ${customer.phone}\n📍 *العنوان:* ${customer.address}\n`;if(customer.notes)msg+=`📝 *ملاحظات:* ${customer.notes}\n`;msg+='━━━━━━━━━━━━━━━━━━\n🛒 *الطلبات:*\n\n';(data.items||[]).forEach(item=>{msg+=`🔹 *${item.quantity}x ${item.product_name}*\n`;if(item.size)msg+=`   📐 الحجم: ${item.size}\n`;if(item.addons?.length)msg+=`   ➕ إضافات: ${item.addons.map(a=>a.name).join('، ')}\n`;msg+=`   💵 السعر: ${item.line_total} ج.م\n\n`});msg+=`━━━━━━━━━━━━━━━━━━\nقيمة المنتجات: ${data.subtotal} ج.م\nالتوصيل: ${data.delivery_fee} ج.م\n💰 *الإجمالي: ${data.total} ج.م*\n`;
      let wa=CONFIG.phone1.replace(/\D/g,'');if(wa.startsWith('0'))wa='20'+wa.slice(1);const waUrl=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;state.cart=[];state.checkout=false;state.cartOpen=false;state.loading=false;render();toast(`تم حفظ الطلب ${data.order_number} بنجاح`);if(whatsappTab&&!whatsappTab.closed)whatsappTab.location.href=waUrl;else window.location.href=waUrl;
    }catch(error){if(whatsappTab&&!whatsappTab.closed)whatsappTab.close();state.loading=false;render();console.error('[Hopa order]',error);toast(error.message||'حصل خطأ أثناء تسجيل الطلب. حاول تاني.','error')}}
  };
  window.Hopa=Hopa;
  async function start(){try{state.loading=true;await loadCatalog();state.loading=false;render()}catch(error){state.loading=false;state.categories=[];state.products=[];state.addons=[];render();console.error('[Hopa catalog]',error);toast('تعذر الاتصال بقاعدة البيانات. تأكد من تنفيذ schema.sql و seed.sql.', 'error')}finally{const loader=$('#loader');if(loader){loader.classList.add('loader-hide');setTimeout(()=>loader.remove(),800)}}}
  document.addEventListener('DOMContentLoaded',start);
})();
</script>
